<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>自分で作るタイマー</title>
  <style>
    :root {
      color: white;
      font-family: "Yu Gothic Ul", sans-serif;
      user-select: none;
      min-height: 100dvh;
      position: relative;
      margin: 0;
      padding: 0;
      --count_down_color: #FFDC87;
      --count_down_hover_color: #F5CB69;
      --count_down_border_color: #C5A574;
      --count_up_color: #91DCFF;
      --count_up_hover_color: #7AC8FF;
      --count_up_border_color: #60AADE;
      --circle_color: #FFDC87;
      --circle_hover_color: #F5CB69;
      --circle_border_color: #C5A574;
      --progress_color: #FFDC87;
      --progress_hover_color: #F5CB69;
      --progress_border_color: #C5A574;
    }

    body {
      background-color: white;
      margin: 0;
    }

    #settings_screen {
      display: flex;
      flex-direction: column;
      width: 100dvw;
      height: 100dvh;
      color: #0F1946;
      font-weight: bold;
    }

    .header {
      color: white;
      text-align: center;
      font-weight: 450;
      font-size: clamp(18px, 1rem + 1dvw, 48px);
      flex-basis: 4vh;
      background-color: #3BB3EF;
      border-bottom: 0.3vh solid #007df1;
    }

    .main {
      flex-grow: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #CDEBFF;
    }

    .footer {
      flex-basis: 7vh;
      background: white;
    }

    button {
      background: none;
      border: 0;
      margin: 10px;
    }

    .disable {
      display: none !important;
    }

    .button {
      text-align: center;
      font-size: clamp(18px, 1rem + 1dvw, 48px);
      justify-content: center;
    }

    .button button:hover,
    .timer_screen_control button:hover,
    .timer_control button:hover {
      background: #7AC8FF;
    }

    .button button,
    .timer_control button {
      font-size: clamp(12px, 0.5rem + 1.5dvw, 20px);
      font-weight: bold;
      background: #91DCFF;
      color: #0F1946;
      border-radius: 9999px;
      border-color: #5BA7DD;
      padding: 5px;
      width: 11vh;
      height: 6vh;
    }

    #count_up_button {
      border-top-right-radius: 0px;
      border-bottom-right-radius: 0px;
      background-color: var(--count_up_color);
      border: 2px solid var(--count_up_border_color);
      border-right: none;
      margin-right: 0;
    }

    #count_up_button:hover {
      background-color: var(--count_up_hover_color);
    }

    #count_down_button {
      border-top-left-radius: 0px;
      border-bottom-left-radius: 0px;
      background-color: var(--count_down_color);
      border: 2px solid var(--count_down_border_color);
      border-left: none;
      margin-left: 0;
    }

    #count_down_button:hover {
      background-color: var(--count_down_hover_color);
    }

    .count_button {
      flex-grow: 1;
      height: auto;
    }

    .container-grid {
      box-sizing: border-box;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .timer_text {
      background: #CDEBFF;
      font-size: clamp(20px, 3rem + 15dvw, 200px);
      box-sizing: border-box;
      border: 0;
      outline: 0;
      margin: 0 auto;
    }

    .control {
      display: flex;
      align-items: center;
      flex-direction: row;
    }

    #music_button {
      border: 5px solid #0F1946;
      border-radius: 50%;
    }

    #reset_button {
      border: 5px solid #0F1946;
      border-radius: 50%;
    }

    .progress_control {
      order: 1;
      flex-grow: 1;
      height: auto;
    }

    #circle_control_button,
    #bar_control_button {
      box-sizing: border-box;
      width: 17vh;
      margin-top: 15px;
      margin-bottom: 15px;
      margin-right: auto;
      margin-left: auto;
      display: block;
    }

    #circle_control_button {
      background-color: var(--circle_color);
      border: 2px solid var(--circle_border_color);
    }

    #circle_control_button:hover {
      background-color: var(--circle_hover_color);
    }

    #bar_control_button {
      background-color: var(--progress_color);
      border: 2px solid var(--progress_border_color);
    }

    #bar_control_button:hover {
      background-color: var(--progress_hover_color);
    }

    #timer_screen {
      position: relative;
      width: 100dvw;
      height: 100dvh;
      align-content: center;
    }

    .timer_control button {
      color: #0F1946;
      background: #91DCFF;
      font-size: 10vh;
      font-weight: bold;
      width: 22vh;
      height: 11vh;
      border-radius: 9999px;
      text-align: center;
    }

    .timer_control {
      margin: 0 auto;
    }

    .progress_background {
      width: 98dvw;
      height: 6dvh;
      background-color: #0C3F72;
      border-radius: 6px;
      margin: 20px auto 20px auto;
      overflow: hidden;
    }

    .progress_bar {
      width: 100%;
      height: 100%;
      background-color: #1C95D4;
      border-radius: 6px;
      overflow: hidden;
    }

    .progress_bar.animation {
      transition: width 1s linear;
    }

    .timer_circle {
      position: relative;
      width: 90vmin;
      height: 90vmin;
      margin: 0 auto;
    }

    #timer_svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
      margin: 10px 0;
    }

    #timer_svg circle {
      fill: none;
      stroke-width: 100px;
    }

    .circle_background {
      stroke: #0C3F72;
    }

    #timer_circle_progress {
      stroke: #1C95D4;
      /* 円の周の長さ */
      stroke-dasharray: calc((50 * 2) * 3.14);
      /* 点線を始める位置、どのぐらい消えさせるか */
      stroke-dashoffset: 0;
    }

    #timer_circle_progress.animation {
      transition: stroke-dashoffset 1s linear;
    }

    .timer_screen_control img:nth-child(1) {
      position: absolute;
      right: 1%;
      top: 1%;
      margin-right: 60px
    }

    .timer_screen_control img:nth-child(2) {
      position: absolute;
      right: 1%;
      top: 1%;
    }

    #timer_screen_text {
      color: white;
      text-align: center;
      font-size: 32dvw;
      font-weight: bold;
      max-width: 100%;
      min-width: 0;
      white-space: nowrap;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    @media screen and (max-width: 800px) {
      .timer_control button {
        width: 10dvh;
        height: 5dvh;
        font-size: 4dvh;
      }

      .timer_text {
        font-size:
      }

      .main {
        flex-direction: column;
      }

      .progress_control {
        order: 0;
        flex-grow: unset;
      }

      .count_button {
        flex-grow: unset;
        display: flex;
        flex-direction: column;
      }

      .container-grid {
        flex-grow: unset;
      }
    }
  </style>
</head>

<body>
  <div id="settings_screen" class="enable">
    <div class="header">
      <span>タイマー</span>
    </div>
    <div class="main">
      <div class="count_button button">
        <div id="background_count">カウント</div>
        <div>
          <button id="count_up_button" class="count_button_off" type="button"
            onclick="set_timer_count('up')">アップ</button><button id="count_down_button" class="count_button_on"
            type="button" onclick="set_timer_count('down')">ダウン</button>
        </div>
      </div>
      <div class="progress_control button">
        <button type="button" id="circle_control_button" onclick="circle_control()">円グラフで表示</button><button
          type="button" id="bar_control_button" onclick="bar_control()">帯を表示</button>
      </div>
      <div class="container-grid">
        <div class="timer_control">
          <button type="button" class="minute_button" onclick="a_up_timer('minute')">▲</button>
          <button type="button" class="second_button" onclick="a_up_timer('second')">▲</button>
        </div>
        <div class="timer_text">
          <span id="minute">00</span><span>:</span><span id="second">00</span>
        </div>
        <div class="timer_control">
          <button type="button" class="minute_button2" onclick="a_down_timer('minute')">▼</button>
          <button type="button" class="second_button2" onclick="a_down_timer('second')">▼</button>
        </div>
      </div>
    </div>
    <div class="button control footer">
      <img src="music_on.svg" id="music_button" width="60px" height="60px" alt="通知音オンオフ" onclick="music_toggle()">
      <img src="play2.svg" id="start_button" width="150px" height="150px" alt="スタート" onclick="timer_start()">
      <img src="refresh.svg" id="reset_button" width="60px" height="60px" alt="リセット" onclick="reset()">
    </div>


  </div>

  <div id="timer_screen" class="disable">
    <div class="timer_circle">
      <svg id="timer_svg" viewBox="0 0 200 200">
        <circle class="circle_background" cx="100" cy="100" r="50"></circle>
        <circle id="timer_circle_progress" class="circle_progress" cx="100" cy="100" r="50"></circle>
      </svg>
    </div>
    <div class="progress">
      <div class="progress_background">
        <div class="progress_bar"></div>
      </div>
    </div>
    <div class="timer_screen_text">
      <span id="timer_screen_text"></span>
    </div>
    <div class="timer_screen_control">
      <img src="pause.svg" id="pause_button" width="48px" height="48px" alt="一時停止" onclick="pause()">
      <img src="stop.svg" width="48px" height="48px" alt="停止" onclick="stop()">
    </div>
  </div>

  <script>
    let timer_count = "down";
    let timer_interval = null;
    let total_seconds = 0;
    let now_seconds = 0;
    let minute = 0;
    let second = 0;
    let pause_state = "running";
    let music = "on";

    function set_timer_count(text) {
      if (text === 'up' || text === 'down') {
        timer_count = text;
      } if (timer_count === 'up') {
        document.getElementById("count_up_button").style.setProperty("--count_up_color", "#FFDC87");
        document.getElementById("count_up_button").style.setProperty("--count_up_border_color", "#C5A574");
        document.getElementById("count_up_button").style.setProperty("--count_up_hover_color", "#F5CB69");
        document.getElementById("count_down_button").style.setProperty("--count_down_color", "#91DCFF");
        document.getElementById("count_down_button").style.setProperty("--count_down_border_color", "#60AADE");
        document.getElementById("count_down_button").style.borderLeft = "none";
        document.getElementById("count_down_button").style.setProperty("--count_down_hover_color", "#7AC8FF");
      } else {
        document.getElementById("count_up_button").style.setProperty("--count_up_color", "#91DCFF");
        document.getElementById("count_up_button").style.setProperty("--count_up_border_color", "#60AADE");
        document.getElementById("count_up_button").style.setProperty("--count_up_hover_color", "#7AC8FF");
        document.getElementById("count_up_button").style.borderRight = "none";
        document.getElementById("count_down_button").style.setProperty("--count_down_color", "#FFDC87");
        document.getElementById("count_down_button").style.setProperty("--count_down_border_color", "#C5A574");
        document.getElementById("count_down_button").style.setProperty("--count_down_hover_color", "#F5CB69");
      }
    }

    // 画面の入力欄（Input）の数値を最新の変数と同期する関数
    function update_settings_display(total) {
      document.getElementById("minute").textContent = minute.toString().padStart(2, "0");
      document.getElementById("second").textContent = second.toString().padStart(2, "0");
      now_seconds = minute * 60 + second;
      if (total === "total") {
        total_seconds = minute * 60 + second;
      }
    }

    function update_timer_display() {
      document.getElementById("timer_screen_text").textContent = minute.toString().padStart(2, '0') + ":" + second.toString().padStart(2, '0');
      document.querySelector(".progress_bar").style.width = (now_seconds / total_seconds) * 100 + "%";
      document.querySelector("#timer_circle_progress").style.strokeDashoffset = offset;
    }

    // 入力欄から現在の数値を読み込む関数
    function load_settings_inputs(total) {
      minute = parseInt(document.getElementById("minute").textContent) || 0;
      second = parseInt(document.getElementById("second").textContent) || 0;
      now_seconds = minute * 60 + second;
      if (total === "total") {
        total_seconds = now_seconds;
      }
    }

    function a_up_timer(up_time) {
      load_settings_inputs("total"); // 現在の入力を取得
      switch (up_time) {
        case 'minute': minute++; break;
        case 'second': second++;
          if (second === 60) {
            second = 0;
            minute++;
          } break;
      }
      update_settings_display("total"); // 画面を更新
    }

    function a_down_timer(down_time) {
      load_settings_inputs("total"); // 現在の入力を取得
      switch (down_time) {
        case 'minute': if (minute > 0) minute--; break;
        case 'second': if (second > 0) {
          second--;
        } else {
          if (minute > 0) {
            minute--;
          }
        }
          break;
      }
      update_settings_display("total"); // 画面を更新
    }

    const getLength = radius => (radius * 2) * Math.PI; // 関数 "円の周の長さを計算する"
    const getStep = (length, time) => length / time;//関数 "1秒あたりの移動距離を計算する"

    let offset = 0;

    function timer() {
      if (timer_count === "down") {
        // ダウンカウント処理
        if (minute === 0 && second === 0) {
          clearInterval(timer_interval);
          timer_interval = null;
          document.querySelector("#timer_screen_text").style.color = "red";
          if (music === "on") {
            audio = new Audio('alarm.mp3');
            audio.play();
          }
          document.getElementById("timer_circle_progress").style.transition = "none";
          document.querySelector(".progress_bar").style.transition = "none";
          return;
        }

        if (second > 0) {
          second--;
          offset = offset + getStep(getLength(50), total_seconds);
        } else {
          second = 59;
          offset = offset + getStep(getLength(50), total_seconds);
          if (minute > 0) {
            minute--;
          }
        }
        now_seconds = minute * 60 + second;
      } else {
        // アップカウント処理
        second++;
        offset = offset - getStep(getLength(50), total_seconds);
        if (second >= 60) {
          second = 0;
          minute++;
        }

        now_seconds = minute * 60 + second;
        if (now_seconds > total_seconds) {
          clearInterval(timer_interval);
          timer_interval = null;
          document.querySelector("#timer_screen_text").style.color = "red";
          if (music === "on") {
            audio = new Audio('alarm.mp3');
            audio.play();
          }
          document.getElementById("timer_circle_progress").style.transition = "none";
          document.querySelector(".progress_bar").style.transition = "none";
          return;
        }
      }
      update_timer_display();
    }

    // タイマー開始
    function timer_start() {
      if (timer_interval !== null) return; // 二重起動を防止

      // 手入力された値も含めて設定を読み込み、合計時間を確定する
      load_settings_inputs("total");
      if (total_seconds <= 0) return;

      document.getElementById("timer_screen").classList.remove("animation");
      document.getElementById("timer_circle_progress").style.removeProperty("transition");
      document.querySelector(".progress_bar").style.removeProperty("transition");

      document.body.style.backgroundColor = "#141E42";
      document.querySelector("#timer_screen_text").style.color = "white";
      up_count_reset = "true";

      if (timer_count === "up") {
        second = 0;
        minute = 0;
        now_seconds = 0;
        offset = getLength(50);
        document.querySelector(".progress_bar").style.width = "0%";
        document.querySelector("#timer_circle_progress").style.strokeDashoffset = offset;
      } else {
        offset = 0;
        document.querySelector(".progress_bar").style.width = "100%";
        document.getElementById("timer_circle_progress").style.strokeDashoffset = 0;
      }

      // transition が無効な状態で、表示文字と進捗の初期位置を揃える
      update_timer_display();

      document.querySelector("#settings_screen").classList.replace("enable", "disable");
      document.getElementById("timer_screen").classList.replace("disable", "enable");

      requestAnimationFrame(() => {
        document.getElementById("timer_screen").classList.add("animation");
        document.getElementById("timer_circle_progress").style.setProperty("transition", "stroke-dashoffset 1s linear");
        document.querySelector(".progress_bar").style.setProperty("transition", "width 1s linear");
        timer_interval = setInterval(timer, 1000);
      });
    }

    // リセット
    function reset() {
      minute = 0;
      second = 0;
      update_settings_display("total");
      document.getElementById("timer_svg").classList.remove("disable");
      document.getElementById("circle_control_button").style.setProperty("--circle_color", "#FFDC87");
      document.getElementById("circle_control_button").style.setProperty("--circle_hover_color", "#F5CB69");
      document.getElementById("circle_control_button").style.setProperty("--circle_border_color", "#C5A574");
      document.querySelector(".progress").classList.remove("disable");
      document.getElementById("bar_control_button").style.setProperty("--progress_color", "#FFDC87");
      document.getElementById("bar_control_button").style.setProperty("--progress_hover_color", "#F5CB69");
      document.getElementById("bar_control_button").style.setProperty("--progress_border_color", "#C5A574");
    }

    function stop() {
      document.querySelector("#settings_screen").classList.replace("disable", "enable");
      document.querySelector("#timer_screen").classList.replace("enable", "disable");
      document.body.style.backgroundColor = "#CDEBFF";
      clearInterval(timer_interval);
      timer_interval = null;
      audio = null; // アラームの Audio オブジェクトをリセット
    }

    function pause() {
      if (pause_state === "running") {
        document.getElementById("pause_button").setAttribute("src", "play.svg");
        pause_state = "paused";
        clearInterval(timer_interval);
        timer_interval = null;

        // transition を一時的に無効化（即時応答のため）
        document.getElementById("timer_circle_progress").style.transition = "none";
        document.querySelector(".progress_bar").style.transition = "none";

        // animationPlayState を適用
        document.querySelector(".progress_bar").style.animationPlayState = pause_state;
        document.getElementById("timer_circle_progress").style.animationPlayState = pause_state;
      } else {
        document.getElementById("pause_button").setAttribute("src", "pause.svg");
        pause_state = "running";

        // transition を再設定
        document.getElementById("timer_circle_progress").style.transition = "stroke-dashoffset 1s linear";
        document.querySelector(".progress_bar").style.transition = "width 1s linear";

        timer_interval = setInterval(timer, 1000);
      }
    }

    document.querySelector('.second_button').addEventListener('wheel', (event) => {
      if (event.deltaY > 0) {
        a_down_timer("second");
      } else {
        a_up_timer("second");
      }
    }, { passive: true });
    document.querySelector('.minute_button').addEventListener('wheel', (event) => {
      if (event.deltaY > 0) {
        a_down_timer("minute");
      } else {
        a_up_timer("minute");
      }
    }, { passive: true });
    document.querySelector('.second_button2').addEventListener('wheel', (event) => {
      if (event.deltaY > 0) {
        a_down_timer("second");
      } else {
        a_up_timer("second");
      }
    }, { passive: true });
    document.querySelector('.minute_button2').addEventListener('wheel', (event) => {
      if (event.deltaY > 0) {
        a_down_timer("minute");
      } else {
        a_up_timer("minute");
      }
    }, { passive: true });
    document.getElementById("minute").addEventListener('wheel', (event) => {
      if (event.deltaY > 0) {
        a_down_timer("minute");
      } else {
        a_up_timer("minute");
      }
    }, { passive: true });
    document.getElementById("second").addEventListener('wheel', (event) => {
      if (event.deltaY > 0) {
        a_down_timer("second");
      } else {
        a_up_timer("second");
      }
    }, { passive: true });

    function circle_control() {
      const svg = document.querySelector("#timer_svg");
      const btn = document.getElementById("circle_control_button");

      svg.classList.toggle("disable");

      // .disableクラスがついているかどうかで判定
      if (svg.classList.contains("disable")) {
        // 非表示になったときの色
        btn.style.setProperty("--circle_color", "#91DCFF");
        btn.style.setProperty("--circle_hover_color", "#7AC8FF");
        btn.style.setProperty("--circle_border_color", "#60AADE");
      } else {
        // 表示されているときの色
        btn.style.setProperty("--circle_color", "#FFDC87");
        btn.style.setProperty("--circle_hover_color", "#F5CB69");
        btn.style.setProperty("--circle_border_color", "#C5A574");
      }
    }

    function bar_control() {
      const progress = document.querySelector(".progress");
      const btn = document.getElementById("bar_control_button");

      progress.classList.toggle("disable");

      // .disableクラスがついているかどうかで判定
      if (progress.classList.contains("disable")) {
        // 非表示になったときの色
        btn.style.setProperty("--progress_color", "#91DCFF");
        btn.style.setProperty("--progress_hover_color", "#7AC8FF");
        btn.style.setProperty("--progress_border_color", "#60AADE");
      } else {
        // 表示されているときの色
        btn.style.setProperty("--progress_color", "#FFDC87");
        btn.style.setProperty("--progress_hover_color", "#F5CB69");
        btn.style.setProperty("--progress_border_color", "#C5A574");
      }
    }

    function music_toggle() {
      if (music === "on") {
        music = "off";
        document.getElementById("music_button").setAttribute("src", "music_off.svg");
      } else {
        music = "on";
        document.getElementById("music_button").setAttribute("src", "music_on.svg");
      }
    }
  </script>
</body>

</html>
