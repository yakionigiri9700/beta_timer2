<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>タイマー</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">

  <script type="importmap">
    {
      "imports": {
        "@material/web/": "https://esm.run/@material/web/"
      }
    }
  </script>
  <script type="module">
    import '@material/web/all.js';
    import { styles as typescaleStyles } from '@material/web/typography/md-typescale-styles.js';
    document.adoptedStyleSheets.push(typescaleStyles.styleSheet);
  </script>

  <style>
    :root {
      color: var(--md-sys-color-primary);
      font-family: "Roboto", sans-serif;
      font-optical-sizing: auto;
      font-weight: 600;
      font-style: normal;
      user-select: none;
      min-height: 100dvh;
      position: relative;
      margin: 0;
      padding: 0;
      --count_down_color: #FFDC87;
      --count_down_hover_color: #F5CB69;
      --count_down_border_color: #C5A574;
      --count_up_color: #91DCFF;
      --count_up_hover_color: #7AC8FF;
      --count_up_border_color: #60AADE;
      --circle_color: #FFDC87;
      --circle_hover_color: #F5CB69;
      --circle_border_color: #C5A574;
      --progress_color: #FFDC87;
      --progress_hover_color: #F5CB69;
      --progress_border_color: #C5A574;
      --circle_canvas_width: min(calc(100dvh - (35px + 6dvh)), calc(100dvw - 20px));
      --progress_canvas_width: calc(100dvw - 20px);
      --progress_canvas_height: 6dvh;

      --md-sys-color-primary: #2a6a47;
      --md-sys-color-on-primary: #ffffff;
      --md-sys-color-secondary: #4e6354;
      --md-sys-color-on-secondary: #ffffff;
      --md-sys-tertiary: #3b6470;
      --md-sys-color-on-tertiary: #ffffff;

      --md-sys-color-primary-container: #aff2c4;
      --md-sys-color-on-primary-container: #0b5130;
      --md-sys-color-secondary-container: #d1e8d5;
      --md-sys-color-on-secondary-container: #374B3D;
      --md-sys-color-tertiary-container: #bfe9f8;
      --md-sys-color-on-tertiary-container: #224c58;

      --md-sys-color-surface-dim: #d6dbd5;
      --md-sys-color-surface: #f6fbf4;
      --md-sys-color-surface-bright: #f6fbf4;
      --md-sys-color-surface-container-lowest: #ffffff;
      --md-sys-color-surface-container-low: #f0f5ee;
      --md-sys-color-surface-container: #eaefe8;
      --md-sys-color-surface-container-high: #e5eae3;
      --md-sys-color-surface-container-highest: #dfe4dd;
      --md-sys-color-on-surface: #181d19;
      --md-sys-color-surface-variant: #414942;
      --md-sys-color-outline: #717972;
      --md-sys-color-outline-variant: #c0c9c0;
    }

    body {
      background-color: var(--md-sys-color-surface);
      margin: 0;
    }

    #settings_screen {
      display: flex;
      justify-content: center;
      flex-direction: column;
      width: 100dvw;
      height: 100dvh;
      font-weight: bold;
      overflow: hidden;
    }

    /*.header {
      color: white;
      text-align: center;
      font-weight: 450;
      font-size: clamp(18px, 1rem + 1dvw, 48px);
      flex-basis: 4vh;
      background-color: #3BB3EF;
      border-bottom: 0.3vh solid #007df1;
    }*/

    .main {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    button {
      background: none;
      border: 0;
      cursor: pointer;
    }

    .disable {
      display: none !important;
    }

    .button {
      text-align: center;
      font-size: clamp(18px, 1rem + 1dvw, 48px);
      justify-content: center;
    }

    .button button:hover,
    .timer_screen_control button:hover,
    .timer_control button:hover {
      background: #7AC8FF;
    }

    .button button,
    .timer_control button {
      font-size: clamp(12px, 0.5rem + 1.5dvw, 22px);
      font-weight: bold;
      color: #0F1946;
      border-radius: 9999px;
      padding: 5px;
      width: clamp(60px, 3rem + 5dvw, 120px);
      height: clamp(40px, 2rem + 2dvw, 80px);
      cursor: pointer;
    }

    .count {
      display: flex;
      justify-content: center;
      padding: 5px;
      gap: 3px;
    }

    #count_up_button {
      border-radius: 20px 8px 8px 20px;
      margin-right: 0;
    }

    #count_down_button {
      border-radius: 8px 20px 20px 8px;
    }

    /*#count_up_button:hover {
      background-color: var(--count_up_hover_color);
    }

    #count_down_button {
      border-radius: 8px 9999px 8px 9999px;
      background-color: var(--count_down_color);
      border: 2px solid var(--count_down_border_color);
      border-left: none;
      margin-left: 0;
      cursor: pointer;
    }

    #count_down_button:hover {
      background-color: var(--count_down_hover_color);
    }*/

    .count_button {
      flex: 1;
      height: auto;
    }

    .container-flex {
      box-sizing: border-box;
      display: flex;
      flex-direction: row;
      justify-content: center;
    }

    .timer_text {
      background: transparent;
      font-size: clamp(20px, 3rem + 10dvw, 200px);
      box-sizing: border-box;
      border: 0;
      outline: 0;
      margin: 0 auto;
    }

    .control {
      display: flex;
      align-items: center;
      flex-direction: row;
    }

    .progress_control {
      order: 1;
      height: auto;
      gap: 5px;
      flex: 1;
      padding: 5px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #circle_control_button,
    #bar_control_button {
      /*box-sizing: border-box;
      width: clamp(130px, 5rem + 10dvw, 180px);
      margin-top: 15px;
      margin-bottom: 15px;
      margin-right: auto;
      margin-left: auto;
      cursor: pointer;
      color: #0F1946;
      font-weight: bold;
      font-size: 16px;*/
      width: fit-content;
    }

    #circle_control_button:hover {
      background-color: var(--circle_hover_color);
    }

    #bar_control_button:hover {
      background-color: var(--progress_hover_color);
    }

    #timer_screen {
      position: relative;
      width: 100dvw;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .flex-end {
      justify-content: flex-end !important;
    }

    .timer_control button {
      font-size: 10vh;
      font-weight: bold;
      width: stretch;
      height: 11vh;
      border-radius: 9999px;
      text-align: center;
      cursor: pointer;
    }

    .timer_control {
      margin: 0 auto;
    }

    .button_left {
      border-radius: 20px 8px 8px 20px;
    }

    .button_center {
      border-radius: 8px;
    }

    .button_right {
      border-radius: 8px 20px 20px 8px;
    }

    .up_timer_control,
    .down_timer_control {
      display: flex;
      padding: 5px;
      gap: 3px;
      width: fit-content;
      margin: 0 auto;
      transition: width 1s linear;
    }

    #Fm,
    #Om,
    #Fs,
    #Os {
      transition: 1s;
    }

    .minute_button2,
    .second_button2 {
      margin-bottom: 10px;
    }

    .minute_button,
    .second_button {
      margin-top: 10px;
    }

    .menu {
      padding: 5px;
      margin: 0 auto;
    }

    #progress {
      width: var(--progress_canvas_width);
      height: var(--progress_canvas_height);
      border-radius: 6px;
      margin: 0 auto 20px auto;
      background-color: var(--md-sys-color-secondary-container);
    }

    #progress_canvas {
      width: 100%;
      height: 100%;
      border-radius: 6px;
    }

    /*.progress_background {
      width: 98dvw;
      height: 6dvh;
      background-color: #0C3F72;
      border-radius: 6px;
      margin: 0 auto;
      margin-top: 5px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .progress_bar {
      width: 100%;
      height: 100%;
      background-color: #1C95D4;
      border-radius: 6px;
      overflow: hidden;
    }

    .progress_bar.animation {
      transition: width 1s linear;
    }*/

    #timer_circle {
      position: relative;
      width: var(--circle_canvas_width);
      height: var(--circle_canvas_width);
      margin: 20px auto 10px auto;
      background-color: var(--md-sys-color-secondary-container);
      border-radius: 50%;
    }

    #circle_canvas {
      width: 100%;
      height: 100%;
    }

    #pause_button {
      position: absolute;
      right: 1%;
      top: 1%;
      margin-right: 50px;
    }

    #stop_button {
      position: absolute;
      right: 1%;
      top: 1%;
    }

    #timer_screen_text {
      color: white;
      text-align: center;
      font-size: 32dvw;
      font-weight: bold;
      font-variant-numeric: tabular-nums;
      max-width: 100%;
      min-width: 0;
      white-space: nowrap;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    @media screen and (max-width: 820px) {
      .main {
        flex-direction: column;
      }

      .progress_control {
        order: 0;
        flex-grow: unset;
      }

      .count_button {
        flex-grow: unset;
        display: flex;
        flex-direction: column;
      }

      .container-flex {
        flex-grow: unset;
      }
    }
  </style>
</head>

<body>
  <div id="settings_screen" class="enable">
    <div class="main">
      <div class="count_button button">
        <div id="background_count">カウント</div>
        <div class="count">
          <md-filled-tonal-button id="count_up_button" class="count_button_off" type="button"
            onclick="set_timer_count('up')">アップ</md-filled-tonal-button>
          <md-filled-tonal-button id="count_down_button" class="count_button_on" type="button"
            onclick="set_timer_count('down')">ダウン</md-filled-tonal-button>
        </div>
      </div>
      <div class="progress_control button">
        <md-filled-tonal-button id="circle_control_button" onclick="circle_control()">円グラフで表示</md-filled-tonal-button>
        <md-filled-tonal-button type="button" id="bar_control_button"
          onclick="bar_control()">帯を表示</md-filled-tonal-button>
      </div>
      <div class="center">
        <div class="container-flex">
          <div class="left timer_control" style="margin:0">
            <span id="minute" class="timer_text">00</span>
          </div>
          <div class="center">
            <span class="timer_text">:</span>
          </div>
          <div class="right timer_control" style="margin:0">
            <span id="second" class="timer_text">00</span>
          </div>
        </div>
        <md-switch icons id="toggle"></md-switch>
        <div id="2" class="up_timer_control">
          <md-filled-button id="Fm" class="button_left">+5分</md-filled-button>
          <md-filled-button id="Om" class="button_center">+1分</md-filled-button>
          <md-filled-button id="Fs" class="button_center">+5秒</md-filled-button>
          <md-filled-button id="Os" class="button_right">+1秒</md-filled-button>
        </div>
      </div>
    </div>
    <div class="menu">
      <md-filled-tonal-icon-button id="music_button" onclick="music_toggle()">
        <span class="material-symbols-rounded" id="music_icon">music_note</span>
      </md-filled-tonal-icon-button>
      <md-filled-icon-button id="start_button" onclick="timer_start()">
        <span class="material-symbols-rounded" id="start_icon">play_arrow</span>
      </md-filled-icon-button>
      <md-filled-tonal-icon-button id="reset_button" onclick="reset()">
        <span class="material-symbols-rounded" id="reset_icon">refresh</span>
      </md-filled-tonal-icon-button>
    </div>
  </div>

  <div id="timer_screen" class="disable">
    <div id="timer_circle">
      <canvas id="circle_canvas" width="800" height="800"></canvas>
    </div>
    <div id="progress">
      <canvas id="progress_canvas" width="800" height="100"></canvas>
    </div>
    <div class="timer_screen_text">
      <span id="timer_screen_text"></span>
    </div>
    <div class="timer_screen_control">
      <md-filled-tonal-icon-button id="pause_button" onclick="pause()">
        <span class="material-symbols-rounded" id="pause_icon">pause</span>
      </md-filled-tonal-icon-button>
      <md-filled-icon-button id="stop_button" onclick="stop()">
        <span class="material-symbols-rounded" id="stop_icon">stop</span>
      </md-filled-icon-button>
    </div>
  </div>

  <script>
    let timer_count = "down";
    let total_seconds = 0;
    let now_seconds = 0;
    let minute = 0;
    let second = 0;
    let pause_state = "running";
    let music = "on";
    let canvasStartTime = null;
    let animationId = null;
    let pausedElapsedTime = 0;
    let lastTimeStamp = 0;
    const button = document.getElementById("toggle");

    document.getElementById("toggle").addEventListener("change", () => {
      const fiveMinute = document.getElementById("Fm");
      const oneMinute = document.getElementById("Om");
      const fiveSecond = document.getElementById("Fs");
      const oneSecond = document.getElementById("Os");
      if (button.selected) {
        fiveMinute.textContent = "-5分";
        oneMinute.textContent = "-1分";
        fiveSecond.textContent = "-5秒";
        oneSecond.textContent = "-1秒";
      } else {
        fiveMinute.textContent = "+5分";
        oneMinute.textContent = "+1分";
        fiveSecond.textContent = "+5秒";
        oneSecond.textContent = "+1秒";
      }
    });

    document.getElementById("Fm").addEventListener("click", () => {
      if (button.selected) {
        down_timer("minute", 5);
      } else {
        up_timer("minute", 5);
      }
    });
    document.getElementById("Om").addEventListener("click", () => {
      if (button.selected) {
        down_timer("minute", 1);
      } else {
        up_timer("minute", 1);
      }
    });
    document.getElementById("Fs").addEventListener("click", () => {
      if (button.selected) {
        down_timer("second", 5);
      } else {
        up_timer("second", 5);
      }
    });
    document.getElementById("Os").addEventListener("click", () => {
      if (button.selected) {
        down_timer("second", 1);
      } else {
        up_timer("second", 1);
      }
    });

    function set_timer_count(text) {
      if (text === 'up' || text === 'down') {
        timer_count = text;
      } if (timer_count === 'up') {
        document.getElementById("count_up_button").style.setProperty("--md-filled-tonal-button-container-color", "#FFDC87");
        document.getElementById("count_down_button").style.setProperty("--md-filled-tonal-button-container-color", "#91DCFF");
      } else {
        document.getElementById("count_up_button").style.setProperty("--md-filled-tonal-button-container-color", "#91DCFF");
        document.getElementById("count_down_button").style.setProperty("--md-filled-tonal-button-container-color", "#FFDC87");
      }
    }

    // 画面の入力欄（Input）の数値を最新の変数と同期する関数
    function update_settings_display(total) {
      document.getElementById("minute").textContent = minute.toString().padStart(2, "0");
      document.getElementById("second").textContent = second.toString().padStart(2, "0");
      now_seconds = minute * 60 + second;
      if (total === "total") {
        total_seconds = minute * 60 + second;
      }
    }

    function update_timer_display() {
      document.getElementById("timer_screen_text").textContent = minute.toString().padStart(2, '0') + ":" + second.toString().padStart(2, '0');
    }

    // 入力欄から現在の数値を読み込む関数
    function load_settings_inputs(total) {
      minute = parseInt(document.getElementById("minute").textContent) || 0;
      second = parseInt(document.getElementById("second").textContent) || 0;
      now_seconds = minute * 60 + second;
      if (total === "total") {
        total_seconds = now_seconds;
      }
    }

    function up_timer(mors, up_time) {
      load_settings_inputs("total"); // 現在の入力を取得
      switch (mors) {
        case 'minute':
          minute += up_time;
          break;
        case 'second':
          second += up_time;
          if (second >= 60) {
            second = second -= 60;
            minute++;
          }
          break;
      }
      update_settings_display("total"); // 画面を更新
    }

    function down_timer(mors, down_time) {
      load_settings_inputs("total"); // 現在の入力を取得
      switch (mors) {
        case 'minute':
          minute -= down_time;
          if (minute < 0) {
            minute = 0;
            if (second > 0) second--;
          }
          break;
        case 'second':
          second -= down_time;
          if (second < 0) {
            second = 0;
            if (minute > 0) minute--;
          }
          break;
      }
      update_settings_display("total"); // 画面を更新
    }

    let audio = new Audio("alarm.mp3");

    // タイマー開始
    function timer_start() {
      if (canvasStartTime !== null) return; // 二重起動を防止
      
      // 手入力された値も含めて設定を読み込み、合計時間を確定する
      load_settings_inputs("total");
      if (total_seconds <= 0) return;

      document.querySelector("#timer_screen_text").style.color = "white";

      if (timer_count === "up") {
        second = 0;
        minute = 0;
        now_seconds = 0;
      }

      update_timer_display();
      animationId = requestAnimationFrame(draw);

      document.querySelector("#settings_screen").classList.replace("enable", "disable");
      document.getElementById("timer_screen").classList.replace("disable", "enable");
      resizeCanvases();
    }

    // リセット
    function reset() {
      minute = 0;
      second = 0;
      update_settings_display("total");
      if (document.getElementById("timer_circle").classList.contains("disable")) circle_control();
      if (document.getElementById("progress").classList.contains("disable")) bar_control();
      if (music === "off") music_toggle();
    }

    function stop() {
      document.querySelector("#settings_screen").classList.replace("disable", "enable");
      document.querySelector("#timer_screen").classList.replace("enable", "disable");
      document.getElementById("pause_icon").textContent = "pause";
      pause_state = "running";

      cancelAnimationFrame(animationId);
      animationId = null;
      canvasStartTime = null;
      pausedElapsedTime = 0;
      audio.pause();
      audio.currentTime = 0;
    }

    function pause() {
      if (canvasStartTime) {
        if (pause_state === "running") {
          document.getElementById("pause_icon").textContent = "play_arrow";
          pause_state = "paused";
          cancelAnimationFrame(animationId);
          animationId = null;
          if (canvasStartTime !== null) pausedElapsedTime = (lastTimeStamp - canvasStartTime) / 1000;
        } else {
          document.getElementById("pause_icon").textContent = "pause";
          pause_state = "running";
          canvasStartTime = null;
          animationId = requestAnimationFrame(draw);
        }
      }
    }


    document.getElementById("minute").addEventListener('wheel', (event) => {
      if (event.deltaY > 0) {
        down_timer("minute", 1);
      } else {
        up_timer("minute", 1);
      }
    }, { passive: true });
    document.getElementById("second").addEventListener('wheel', (event) => {
      if (event.deltaY > 0) {
        down_timer("second", 1);
      } else {
        up_timer("second", 1);
      }
    }, { passive: true });

    function circle_control() {
      const cir = document.getElementById("timer_circle");
      const btn = document.getElementById("circle_control_button");

      cir.classList.toggle("disable");

      // .disableクラスがついているかどうかで判定
      if (cir.classList.contains("disable")) {
        // 非表示になったときの色
        btn.style.setProperty("--md-filled-tonal-button-container-color", "#91DCFF");
        document.getElementById("timer_screen").classList.add("flex-end");
      } else {
        // 表示されているときの色
        btn.style.setProperty("--md-filled-tonal-button-container-color", "#FFDC87");
        document.getElementById("timer_screen").classList.remove("flex-end");
      }
    }

    function bar_control() {
      const progress = document.getElementById("progress");
      const btn = document.getElementById("bar_control_button");

      progress.classList.toggle("disable");

      // .disableクラスがついているかどうかで判定
      if (progress.classList.contains("disable")) {
        // 非表示になったときの色
        btn.style.setProperty("--md-filled-tonal-button-container-color", "#91DCFF");
      } else {
        // 表示されているときの色
        btn.style.setProperty("--md-filled-tonal-button-container-color", "#FFDC87");

      }
    }

    function music_toggle() {
      if (music === "on") {
        music = "off";
        document.getElementById("music_icon").textContent = "music_off";
      } else {
        music = "on";
        document.getElementById("music_icon").textContent = "music_note";
      }
    }

    const circle_canvas = document.getElementById("circle_canvas");
    const circle_ctx = circle_canvas.getContext('2d');
    const progress_canvas = document.getElementById("progress_canvas");
    const progress_ctx = progress_canvas.getContext('2d');

        function draw(timestamp) {
      lastTimeStamp = timestamp;
      if (!canvasStartTime) {
        canvasStartTime = timestamp - (pausedElapsedTime * 1000);
      }

      let elapsedTime = (timestamp - canvasStartTime) / 1000;
      let progress = 1.0 - (elapsedTime / total_seconds);
      if (progress < 0) progress = 0;

      // 論理サイズ（CSSピクセル）を取得
      const circleWidth = circle_canvas.clientWidth;
      const circleHeight = circle_canvas.clientHeight;
      const progressWidth = progress_canvas.clientWidth;
      const progressHeight = progress_canvas.clientHeight;

      // 画面クリア（setTransformが効いているので論理サイズで指定）
      circle_ctx.clearRect(0, 0, circleWidth, circleHeight);
      progress_ctx.clearRect(0, 0, progressWidth, progressHeight);

      const circle_centerX = circleWidth / 2;
      const circle_centerY = circleHeight / 2;
      const radius = Math.min(circle_centerX, circle_centerY);
      const startAngle = -Math.PI / 2;

      const progress_centerY = progressHeight / 2;
      progress_ctx.lineWidth = progressHeight;
      progress_ctx.strokeStyle = '#2A6A47';

      if (timer_count === "up") {
        if (now_seconds >= total_seconds) {
          document.getElementById("timer_screen_text").style.color = "red";
          if (music === "on") audio.play();
          canvasStartTime = null;
          pausedElapsedTime = 0;
          return;
        } else {
          let endAngle = startAngle + -(progress * Math.PI * 2);
          circle_ctx.beginPath();
          circle_ctx.moveTo(circle_centerX, circle_centerY);
          circle_ctx.arc(circle_centerX, circle_centerY, radius, startAngle, endAngle, false);
          circle_ctx.closePath();
          circle_ctx.fillStyle = '#2A6A47';
          circle_ctx.fill();

          let endX = progressWidth * (elapsedTime / total_seconds);
          progress_ctx.beginPath();
          progress_ctx.moveTo(0, progress_centerY);
          progress_ctx.lineTo(endX, progress_centerY);
          progress_ctx.stroke();
          progress_ctx.closePath();

          now_seconds = parseInt(elapsedTime);
        }
      } else {
        if (now_seconds <= 0) {
          document.getElementById("timer_screen_text").style.color = "red";
          if (music === "on") audio.play();
          canvasStartTime = null;
          pausedElapsedTime = 0;
          return;
        } else {
          let endAngle = startAngle + (progress * Math.PI * 2);
          circle_ctx.beginPath();
          circle_ctx.moveTo(circle_centerX, circle_centerY);
          circle_ctx.arc(circle_centerX, circle_centerY, radius, startAngle, endAngle, false);
          circle_ctx.closePath();
          circle_ctx.fillStyle = '#2A6A47';
          circle_ctx.fill();

          let endX = progressWidth * progress;
          progress_ctx.beginPath();
          progress_ctx.moveTo(endX, progress_centerY);
          progress_ctx.lineTo(0, progress_centerY);
          progress_ctx.stroke();
          progress_ctx.closePath();

          now_seconds = total_seconds - parseInt(elapsedTime);
        }
      }

      minute = parseInt(now_seconds / 60);
      second = parseInt(now_seconds % 60);
      update_timer_display();
      animationId = requestAnimationFrame(draw);
    }


    // 初期化時と画面サイズ変更時に呼ぶ（draw() 毎フレームでは呼ばない）
    window.addEventListener("resize", resizeCanvases);
  </script>
</body>
