<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>タイマー</title>

  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

  <script type="importmap">
    {
      "imports": {
        "@material/web/": "https://esm.run/@material/web/"
      }
    }
  </script>
  <script type="module">
    import '@material/web/all.js';
    import { styles as typescaleStyles } from '@material/web/typography/md-typescale-styles.js';
    document.adoptedStyleSheets.push(typescaleStyles.styleSheet);
  </script>

  <style>
    :root {
      color: white;
      font-family: "Roboto", sans-serif;
      user-select: none;
      min-height: 100dvh;
      position: relative;
      margin: 0;
      padding: 0;
      --count_down_color: #FFDC87;
      --count_down_hover_color: #F5CB69;
      --count_down_border_color: #C5A574;
      --count_up_color: #91DCFF;
      --count_up_hover_color: #7AC8FF;
      --count_up_border_color: #60AADE;
      --circle_color: #FFDC87;
      --circle_hover_color: #F5CB69;
      --circle_border_color: #C5A574;
      --progress_color: #FFDC87;
      --progress_hover_color: #F5CB69;
      --progress_border_color: #C5A574;
      --circle_canvas_width: min(calc(100dvh - (35px + 6dvh)), calc(100dvw - 20px));
      --progress_canvas_width: calc(100dvw - 20px);
      --progress_canvas_height: 6dvh;
      --md-filled-tonal-button-container-color: #91DCFF;
      --md-filled-tonal-button-label-text-color: #0F1946;
      --md-filled-button-container-color: #91DCFF;
      --md-filled-button-label-text-color: #0F1946;
    }

    body {
      background-color: white;
      margin: 0;
    }

    #settings_screen {
      display: flex;
      flex-direction: column;
      width: 100dvw;
      height: 100dvh;
      color: #0F1946;
      font-weight: bold;
      overflow: hidden;
    }

    /*.header {
      color: white;
      text-align: center;
      font-weight: 450;
      font-size: clamp(18px, 1rem + 1dvw, 48px);
      flex-basis: 4vh;
      background-color: #3BB3EF;
      border-bottom: 0.3vh solid #007df1;
    }*/

    .main {
      flex-grow: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #CDEBFF;
    }

    .footer {
      flex-basis: 7vh;
      background: white;
      flex-shrink: 0;
    }

    button {
      background: none;
      border: 0;
      cursor: pointer;
    }

    .disable {
      display: none !important;
    }

    .button {
      text-align: center;
      font-size: clamp(18px, 1rem + 1dvw, 48px);
      justify-content: center;
    }

    .button button:hover,
    .timer_screen_control button:hover,
    .timer_control button:hover {
      background: #7AC8FF;
    }

    .button button,
    .timer_control button {
      font-size: clamp(12px, 0.5rem + 1.5dvw, 22px);
      font-weight: bold;
      background: #91DCFF;
      color: #0F1946;
      border-radius: 9999px;
      border-color: #5BA7DD;
      padding: 5px;
      width: clamp(60px, 3rem + 5dvw, 120px);
      height: clamp(40px, 2rem + 2dvw, 80px);
      cursor: pointer;
    }

    .count {
      display: flex;
      justify-content: center;
      padding: 5px;
      gap: 3px;
    }

    #count_up_button {
      border-radius: 20px 8px 8px 20px;
      margin-right: 0;
    }

    #count_down_button {
      border-radius: 8px 20px 20px 8px;
      --md-filled-tonal-button-container-color: #FFDC87;
    }

    /*#count_up_button:hover {
      background-color: var(--count_up_hover_color);
    }

    #count_down_button {
      border-radius: 8px 9999px 8px 9999px;
      background-color: var(--count_down_color);
      border: 2px solid var(--count_down_border_color);
      border-left: none;
      margin-left: 0;
      cursor: pointer;
    }

    #count_down_button:hover {
      background-color: var(--count_down_hover_color);
    }*/

    .count_button {
      flex: 1;
      height: auto;
    }

    .container-flex {
      box-sizing: border-box;
      display: flex;
      flex-direction: row;
      justify-content: center;
    }

    .timer_text {
      background: #CDEBFF;
      font-size: clamp(20px, 3rem + 10dvw, 200px);
      box-sizing: border-box;
      border: 0;
      outline: 0;
      margin: 0 auto;
    }

    .control {
      display: flex;
      align-items: center;
      flex-direction: row;
    }

    #music_button {
      border: 5px solid #0F1946;
      border-radius: 50%;
      cursor: pointer;
    }

    #reset_button {
      border: 5px solid #0F1946;
      border-radius: 50%;
      cursor: pointer;
    }

    #start_button {
      cursor: pointer;
    }

    .progress_control {
      order: 1;
      height: auto;
      gap: 5px;
      flex: 1;
      padding: 5px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #circle_control_button,
    #bar_control_button {
      /*box-sizing: border-box;
      width: clamp(130px, 5rem + 10dvw, 180px);
      margin-top: 15px;
      margin-bottom: 15px;
      margin-right: auto;
      margin-left: auto;
      cursor: pointer;
      color: #0F1946;
      font-weight: bold;
      font-size: 16px;*/
      width: fit-content;
      --md-filled-tonal-button-container-color: #FFDC87;
    }

    #circle_control_button:hover {
      background-color: var(--circle_hover_color);
    }

    #bar_control_button:hover {
      background-color: var(--progress_hover_color);
    }

    #timer_screen {
      position: relative;
      width: 100dvw;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .flex-end {
      justify-content: flex-end !important;
    }

    .timer_control button {
      color: #0F1946;
      background: #91DCFF;
      font-size: 10vh;
      font-weight: bold;
      width: stretch;
      height: 11vh;
      border-radius: 9999px;
      text-align: center;
      cursor: pointer;
    }

    .timer_control {
      margin: 0 auto;
    }

    .button_left {
      border-radius: 20px 8px 8px 20px;
    }

    .button_center {
      border-radius: 8px;
    }

    .button_right {
      border-radius: 8px 20px 20px 8px;
    }

    .up_timer_control,
    .down_timer_control {
      display: flex;
      padding: 5px;
      gap: 3px;
      width: fit-content;
    }

    .minute_button2,
    .second_button2 {
      margin-bottom: 10px;
    }

    .minute_button,
    .second_button {
      margin-top: 10px;
    }

    #progress {
      width: var(--progress_canvas_width);
      height: var(--progress_canvas_height);
      border-radius: 6px;
      margin: 0 auto 20px auto;
      background-color: #0C3F72;
    }

    #progress_canvas {
      width: 100%;
      height: 100%;
      border-radius: 6px;
    }

    /*.progress_background {
      width: 98dvw;
      height: 6dvh;
      background-color: #0C3F72;
      border-radius: 6px;
      margin: 0 auto;
      margin-top: 5px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .progress_bar {
      width: 100%;
      height: 100%;
      background-color: #1C95D4;
      border-radius: 6px;
      overflow: hidden;
    }

    .progress_bar.animation {
      transition: width 1s linear;
    }*/

    #timer_circle {
      position: relative;
      width: var(--circle_canvas_width);
      height: var(--circle_canvas_width);
      margin: 20px auto 10px auto;
      background-color: #0C3F72;
      border-radius: 50%;
    }

    #circle_canvas {
      width: 100%;
      height: 100%;
    }

    .timer_screen_control img:nth-child(1) {
      position: absolute;
      right: 1%;
      top: 1%;
      margin-right: 60px;
      cursor: pointer;
    }

    .timer_screen_control img:nth-child(2) {
      position: absolute;
      right: 1%;
      top: 1%;
      cursor: pointer;
    }

    #timer_screen_text {
      color: white;
      text-align: center;
      font-size: 32dvw;
      font-weight: bold;
      font-variant-numeric: tabular-nums;
      max-width: 100%;
      min-width: 0;
      white-space: nowrap;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    @media screen and (max-width: 820px) {
      .main {
        flex-direction: column;
      }

      .progress_control {
        order: 0;
        flex-grow: unset;
      }

      .count_button {
        flex-grow: unset;
        display: flex;
        flex-direction: column;
      }

      .container-flex {
        flex-grow: unset;
      }
    }
  </style>
</head>

<body>
  <div id="settings_screen" class="enable">
    <div class="main">
      <div class="count_button button">
        <div id="background_count">カウント</div>
        <div class="count">
          <md-filled-tonal-button id="count_up_button" class="count_button_off" type="button"
            onclick="set_timer_count('up')">アップ</md-filled-tonal-button>
          <md-filled-tonal-button id="count_down_button" class="count_button_on" type="button"
            onclick="set_timer_count('down')">ダウン</md-filled-tonal-button>
        </div>
      </div>
      <div class="progress_control button">
        <md-filled-tonal-button id="circle_control_button" onclick="circle_control()">円グラフで表示</md-filled-tonal-button>
        <md-filled-tonal-button type="button" id="bar_control_button"
          onclick="bar_control()">帯を表示</md-filled-tonal-button>
      </div>
      <div class="center">
        <div class="container-flex">
          <div class="left timer_control" style="margin:0">
            <span id="minute" class="timer_text">00</span>
          </div>
          <div class="center">
            <span class="timer_text">:</span>
          </div>
          <div class="right timer_control" style="margin:0">
            <span id="second" class="timer_text">00</span>
          </div>
        </div>
        <div class="up_timer_control">
          <md-filled-button onclick="up_timer('minute', 5)" class="button_left">+5分</md-filled-button>
          <md-filled-button onclick="up_timer('minute', 1)" class="button_center">+1分</md-filled-button>
          <md-filled-button onclick="up_timer('second', 10)" class="button_center">+10秒</md-filled-button>
          <md-filled-button onclick="up_timer('second', 1)" class="button_right">+1秒</md-filled-button>
        </div>
        <div class="down_timer_control">
          <md-filled-button onclick="down_timer('minute', 5)" class="button_left">-5分</md-filled-button>
          <md-filled-button onclick="down_timer('minute', 1)" class="button_center">-1分</md-filled-button>
          <md-filled-button onclick="down_timer('second', 10)" class="button_center">-10秒</md-filled-button>
          <md-filled-button onclick="down_timer('second', 1)" class="button_right">-1秒</md-filled-button>
        </div>
      </div>
    </div>
    <div class="button control footer">
      <img src="music_on.svg" id="music_button" width="60px" height="60px" alt="通知音オンオフ" onclick="music_toggle()">
      <img src="play2.svg" id="start_button" width="150px" height="150px" alt="スタート" onclick="timer_start()">
      <img src="refresh.svg" id="reset_button" width="60px" height="60px" alt="リセット" onclick="reset()">
    </div>
  </div>

  <div id="timer_screen" class="disable">
    <div id="timer_circle">
      <canvas id="circle_canvas" width="800" height="800"></canvas>
    </div>
    <div id="progress">
      <canvas id="progress_canvas" width="800" height="100"></canvas>
    </div>
    <div class="timer_screen_text">
      <span id="timer_screen_text"></span>
    </div>
    <div class="timer_screen_control">
      <img src="pause.svg" id="pause_button" width="48px" height="48px" alt="一時停止" onclick="pause()">
      <img src="stop.svg" width="48px" height="48px" alt="停止" onclick="stop()">
    </div>
  </div>

  <script>
    let timer_count = "down";
    let total_seconds = 0;
    let now_seconds = 0;
    let minute = 0;
    let second = 0;
    let pause_state = "running";
    let music = "on";
    let canvasStartTime = null;
    let animationId = null;
    let pausedElapsedTime = 0;
    let lastTimeStamp = 0;

    function set_timer_count(text) {
      if (text === 'up' || text === 'down') {
        timer_count = text;
      } if (timer_count === 'up') {
        document.getElementById("count_up_button").style.setProperty("--md-filled-tonal-button-container-color", "#FFDC87");
        document.getElementById("count_down_button").style.setProperty("--md-filled-tonal-button-container-color", "#91DCFF");
      } else {
        document.getElementById("count_up_button").style.setProperty("--md-filled-tonal-button-container-color", "#91DCFF");
        document.getElementById("count_down_button").style.setProperty("--md-filled-tonal-button-container-color", "#FFDC87");
      }
    }

    // 画面の入力欄（Input）の数値を最新の変数と同期する関数
    function update_settings_display(total) {
      document.getElementById("minute").textContent = minute.toString().padStart(2, "0");
      document.getElementById("second").textContent = second.toString().padStart(2, "0");
      now_seconds = minute * 60 + second;
      if (total === "total") {
        total_seconds = minute * 60 + second;
      }
    }

    function update_timer_display() {
      document.getElementById("timer_screen_text").textContent = minute.toString().padStart(2, '0') + ":" + second.toString().padStart(2, '0');
    }

    // 入力欄から現在の数値を読み込む関数
    function load_settings_inputs(total) {
      minute = parseInt(document.getElementById("minute").textContent) || 0;
      second = parseInt(document.getElementById("second").textContent) || 0;
      now_seconds = minute * 60 + second;
      if (total === "total") {
        total_seconds = now_seconds;
      }
    }

    function up_timer(mors, up_time) {
      load_settings_inputs("total"); // 現在の入力を取得
      switch (mors) {
        case 'minute':
          minute += up_time;
          break;
        case 'second':
          second += up_time;
          if (second >= 60) {
            second = second -= 60;
            minute++;
          }
          break;
      }
      update_settings_display("total"); // 画面を更新
    }

    function down_timer(mors, down_time) {
      load_settings_inputs("total"); // 現在の入力を取得
      switch (mors) {
        case 'minute':
          minute -= down_time;
          if (minute < 0) {
            minute = 0;
            if (second > 0) second--;
          }
          break;
        case 'second':
          second -= down_time;
          if (second < 0) {
            second = 0;
            if (minute > 0) minute--;
          }
          break;
      }
      update_settings_display("total"); // 画面を更新
    }

    let audio = new Audio("alarm.mp3");

    // タイマー開始
    function timer_start() {
      if (canvasStartTime !== null) return; // 二重起動を防止

      // 手入力された値も含めて設定を読み込み、合計時間を確定する
      load_settings_inputs("total");
      if (total_seconds <= 0) return;

      document.body.style.backgroundColor = "#141E42";
      document.querySelector("#timer_screen_text").style.color = "white";

      if (timer_count === "up") {
        second = 0;
        minute = 0;
        now_seconds = 0;
      }

      update_timer_display();
      animationId = requestAnimationFrame(draw);

      document.querySelector("#settings_screen").classList.replace("enable", "disable");
      document.getElementById("timer_screen").classList.replace("disable", "enable");
    }

    // リセット
    function reset() {
      minute = 0;
      second = 0;
      update_settings_display("total");
      if (document.getElementById("timer_circle").classList.contains("disable")) circle_control();
      if (document.getElementById("progress").classList.contains("disable")) bar_control();
      if (music === "off") music_toggle();
    }

    function stop() {
      document.querySelector("#settings_screen").classList.replace("disable", "enable");
      document.querySelector("#timer_screen").classList.replace("enable", "disable");
      document.body.style.backgroundColor = "#CDEBFF";
      document.getElementById("pause_button").setAttribute("src", "pause.svg");
      pause_state = "running";

      cancelAnimationFrame(animationId);
      animationId = null;
      canvasStartTime = null;
      pausedElapsedTime = 0;
      audio.pause();
      audio.currentTime = 0;
    }

    function pause() {
      if (canvasStartTime) {
        if (pause_state === "running") {
          document.getElementById("pause_button").setAttribute("src", "play.svg");
          pause_state = "paused";
          cancelAnimationFrame(animationId);
          animationId = null;
          if (canvasStartTime !== null) pausedElapsedTime = (lastTimeStamp - canvasStartTime) / 1000;
        } else {
          document.getElementById("pause_button").setAttribute("src", "pause.svg");
          pause_state = "running";
          canvasStartTime = null;
          animationId = requestAnimationFrame(draw);
        }
      }
    }


    document.getElementById("minute").addEventListener('wheel', (event) => {
      if (event.deltaY > 0) {
        down_timer("minute", 1);
      } else {
        up_timer("minute", 1);
      }
    }, { passive: true });
    document.getElementById("second").addEventListener('wheel', (event) => {
      if (event.deltaY > 0) {
        down_timer("second", 1);
      } else {
        up_timer("second", 1);
      }
    }, { passive: true });

    function circle_control() {
      const cir = document.getElementById("timer_circle");
      const btn = document.getElementById("circle_control_button");

      cir.classList.toggle("disable");

      // .disableクラスがついているかどうかで判定
      if (cir.classList.contains("disable")) {
        // 非表示になったときの色
        btn.style.setProperty("--md-filled-tonal-button-container-color", "#91DCFF");
        document.getElementById("timer_screen").classList.add("flex-end");
      } else {
        // 表示されているときの色
        btn.style.setProperty("--md-filled-tonal-button-container-color", "#FFDC87");
        document.getElementById("timer_screen").classList.remove("flex-end");
      }
    }

    function bar_control() {
      const progress = document.getElementById("progress");
      const btn = document.getElementById("bar_control_button");

      progress.classList.toggle("disable");

      // .disableクラスがついているかどうかで判定
      if (progress.classList.contains("disable")) {
        // 非表示になったときの色
        btn.style.setProperty("--md-filled-tonal-button-container-color", "#91DCFF");
      } else {
        // 表示されているときの色
        btn.style.setProperty("--md-filled-tonal-button-container-color", "#FFDC87");

      }
    }

    function music_toggle() {
      if (music === "on") {
        music = "off";
        document.getElementById("music_button").setAttribute("src", "music_off.svg");
      } else {
        music = "on";
        document.getElementById("music_button").setAttribute("src", "music_on.svg");
      }
    }

    const circle_canvas = document.getElementById("circle_canvas");
    const circle_ctx = circle_canvas.getContext('2d');
    const progress_canvas = document.getElementById("progress_canvas");
    const progress_ctx = progress_canvas.getContext('2d');

    function draw(timestamp) {
      lastTimeStamp = timestamp;
      // 最初の一コマ目で開始時刻を記録
      if (!canvasStartTime) {
        canvasStartTime = timestamp - (pausedElapsedTime * 1000);
      }

      // 開始からの経過秒数を計算 (ミリ秒を1000で割って秒にする)
      let elapsedTime = (timestamp - canvasStartTime) / 1000;

      // 残り割合を計算 (1.0 から 0.0 へ進む)
      // 経過時間を全体時間(total_seconds)で割った値を 1 から引く
      let progress = 1.0 - (elapsedTime / total_seconds);
      // 0以下になったら 0 で固定する
      if (progress < 0) progress = 0;

      // 画面クリア
      circle_ctx.clearRect(0, 0, document.getElementById("circle_canvas").width, document.getElementById("circle_canvas").height);
      progress_ctx.clearRect(0, 0, document.getElementById("progress_canvas").width, document.getElementById("progress_canvas").height);

      circle_canvas.setAttribute("width", circle_canvas.getBoundingClientRect().width);
      circle_canvas.setAttribute("height", circle_canvas.getBoundingClientRect().height);
      progress_canvas.setAttribute("width", progress_canvas.getBoundingClientRect().width);
      progress_canvas.setAttribute("height", progress_canvas.getBoundingClientRect().height);


      // 扇形の描画 (progressが0より大きい時だけ描く)
      const circle_centerX = circle_canvas.width / 2;
      const circle_centerY = circle_canvas.height / 2;
      const radius = circle_centerX;
      const startAngle = -Math.PI / 2;

      const progress_centerY = progress_canvas.height / 2;
      progress_ctx.lineWidth = progress_centerY * 2;
      progress_ctx.strokeStyle = '#1C95D4';

      if (timer_count === "up") {
        // アップ処理
        if (now_seconds >= total_seconds) {
          document.getElementById("timer_screen_text").style.color = "red";
          if (music === "on") audio.play();
          canvasStartTime = null;
          pausedElapsedTime = 0;
          return;
        }
        else {
          let endAngle = startAngle + -(progress * Math.PI * 2);
          circle_ctx.beginPath();
          circle_ctx.moveTo(circle_centerX, circle_centerY);
          circle_ctx.arc(circle_centerX, circle_centerY, radius, startAngle, endAngle, false);
          circle_ctx.closePath();
          circle_ctx.fillStyle = '#1C95D4';
          circle_ctx.fill();

          let endX = progress_canvas.width * (elapsedTime / total_seconds);
          progress_ctx.beginPath();
          progress_ctx.moveTo(0, progress_centerY);
          progress_ctx.lineTo(endX, progress_centerY);
          progress_ctx.stroke();
          progress_ctx.closePath();

          now_seconds = parseInt(elapsedTime);
        }
      } else {
        // ダウン処理
        if (now_seconds <= 0) {
          document.getElementById("timer_screen_text").style.color = "red";
          if (music === "on") audio.play();
          canvasStartTime = null;
          pausedElapsedTime = 0;
          return;
        } else {
          let endAngle = startAngle + (progress * Math.PI * 2);
          circle_ctx.beginPath();
          circle_ctx.moveTo(circle_centerX, circle_centerY);
          circle_ctx.arc(circle_centerX, circle_centerY, radius, startAngle, endAngle, false);
          circle_ctx.closePath();
          circle_ctx.fillStyle = "#1C95D4";
          circle_ctx.fill();

          let endX = progress_canvas.width * progress;
          progress_ctx.beginPath();
          progress_ctx.moveTo(endX, progress_centerY);
          progress_ctx.lineTo(0, progress_centerY);
          progress_ctx.stroke();
          progress_ctx.closePath();

          now_seconds = total_seconds - parseInt(elapsedTime);
        }
      }
      minute = parseInt(now_seconds / 60);
      second = parseInt(now_seconds % 60);
      update_timer_display();
      animationId = requestAnimationFrame(draw);
    }
  </script>
</body>

</html>
