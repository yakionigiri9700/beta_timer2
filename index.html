<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>自分で作るタイマー</title>
  <style>
    :root {
      background: #CDEBFF;
      color: white;
      font-family: "Yu Gothic Ul", sans-serif;
      user-select: none;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      margin: 0;
      --count_down_color: #FFDC87;
      --count_down_hover_color: #F5CB69;
      --count_down_border_color: #C5A574;
      --count_up_color: #91DCFF;
      --count_up_hover_color: #7AC8FF;
      --count_up_border_color: #60AADE;
    }

    button {
      background: none;
      border: none;
    }

    .disable {
      display: none;
    }

    .button {
      text-align: center;
      font-size: 3vh;
      font-weight: bold;
      margin: 10px;
    }

    .button button:hover,
    .timer_screen_control button:hover,
    .timer_control button:hover {
      background: #7AC8FF;
    }

    .button button,
    .timer_control button {
      text-align: center;
      font-size: 3vh;
      font-weight: bold;
      background: #91DCFF;
      color: #0F1946;
      border-radius: 10px;
      border-color: #5BA7DD;
    }

    #count_up_button {
      border-top-right-radius: 0px;
      border-bottom-right-radius: 0px;
      background-color: var(--count_up_color);
      border: 2px solid var(--count_up_border_color);
      border-right: none;
    }

    #count_up_button:hover {
      background-color: var(--count_up_hover_color);
    }

    #count_down_button {
      border-top-left-radius: 0px;
      border-bottom-left-radius: 0px;
      background-color: var(--count_down_color);
      border: 2px solid var(--count_down_border_color);
      border-left: none;
    }

    #count_down_button:hover {
      background-color: var(--count_down_hover_color);
    }

    .count_button {
      text-align: center;
      font-size: 3vh;
      font-weight: bold;
      position: absolute;
      top: 25%;
      right: 3%;
    }

    #background_count {
      color: #0F1946;
    }

    .timer_text {
      color: #0F1946;
      text-align: center;
      font-size: 12vh;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
    }

    .timer_text input {
      color: #0F1946;
      background: #CDEBFF;
      text-align: center;
      font-size: 10vh;
      font-weight: bold;
      width: 12vh;
      height: 12vh;
      box-sizing: border-box;
      border: 0px;
      outline: none;
    }

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }


    #timer_screen {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #141E42;
    }

    .timer_control {
      text-align: center;
      display: flex;
      justify-content: space-between;
    }

    .timer_control button {
      color: #0F1946;
      background: #91DCFF;
      font-size: 10vh;
      font-weight: bold;
      width: 12vh;
      height: 12vh;
      border-radius: 15px;
      text-align: center;
    }

    .progress {
      flex-direction: column;
    }

    .progress_background {
      width: 98vw;
      height: 6vh;
      background-color: #0C3F72;
      border-radius: 10px;
      margin: 20px auto 0 auto;
    }

    .progress_bar {
      width: 0%;
      height: 100%;
      background-color: #1C95D4;
      border-radius: 10px;
      transition: width 1s linear;
    }

    .timer_circle {
      position: relative;
      width: 90vmin;
      height: 90vmin;
      margin: 0 auto;
    }

    #timer_svg {
      width: 100%;
      height: 100%;
      vertical-align: middle;
      transform: rotate(-90deg);
      margin: 10px auto;
      position: absolute;
      flex-direction: column;
    }

    #timer_svg circle {
      fill: none;
      stroke-width: 100px;
    }

    .circle_background {
      stroke: #0C3F72;
    }

    #timer_circle_progress {
      stroke: #1C95D4;
      /* 円の周の長さ */
      stroke-dasharray: calc((50 * 2) * 3.14);
      /* 点線を始める位置、どのぐらい消えさせるか */
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 1s linear;
    }

    .timer_screen_control img:nth-child(1) {
      position: absolute;
      right: 1%;
      top: 1%;
      margin-right: 60px
    }

    .timer_screen_control img:nth-child(2) {
      position: absolute;
      right: 1%;
      top: 1%;
    }

    #timer_screen_text {
      color: white;
      text-align: center;
      font-size: 38vw;
      font-weight: bold;
      max-width: 100%;
      min-width: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
  </style>
</head>

<body>
  <div id="settings_screen" class="enable">
    <div class="count_button button">
      <p><span id="background_count">カウント</span></p>
      <button id="count_up_button" class="count_button_off" type="button"
        onclick="set_timer_count('up')">アップ</button><button id="count_down_button" class="count_button_on" type="button"
        onclick="set_timer_count('down')">ダウン</button>
    </div>
    <div class="timer_control">
      <button type="button" onclick="a_up_timer('minute')" onmousewheel="a_up_timer('minute')">▲</button>
      <button type="button" onclick="a_up_timer('second')" onmousewheel="a_up_timer('second')">▲</button>
    </div>
    <div class="timer_text">
      <input id="minute" type="number" value="0" max="59" min="0" autocomplete="off" />
      <span>:</span>
      <input id="second" type="number" value="0" max="59" min="0" autocomplete="off" />
    </div>
    <div class="timer_control">
      <button type="button" onfocus="a_down_timer('minute')" onmousewheel="a_down_timer('minute')">▼</button>
      <button type="button" onclick="a_down_timer('second')" onmousewheel="a_down_timer('second')">▼</button>
    </div>
    <div class="button">
      <button type="button" onclick="timer_start()">スタート</button>
      <button type="button" onclick="reset()">リセット</button>
    </div>

  </div>

  <div id="timer_screen" class="disable">
    <div class="timer_circle">
      <svg id="timer_svg" viewBox="0 0 200 200">
        <circle class="circle_background" cx="100" cy="100" r="50"></circle>
        <circle id="timer_circle_progress" class="circle_progress" cx="100" cy="100" r="50"></circle>
      </svg>
    </div>
    <div class="progress">
      <div class="progress_background">
        <div class="progress_bar"></div>
      </div>
    </div>
    <div class="timer_screen_text">
      <span id="timer_screen_text"></span>
    </div>
    <div class="timer_screen_control">
      <img src="pause.svg" width="48px" height="48px" alt="一時停止" onclick="pause()">
      <img src="stop.svg" width="48px" height="48px" alt="停止" onclick="stop()">
    </div>
  </div>

  <script>
    let timer_count = "down";
    let timer_interval = null;
    let total_seconds = 0;
    let now_seconds = 0;
    let minute = 0;
    let second = 0;
    let pause_state = "running";
    let pause_to = "";

    function set_timer_count(text) {
      if (text === 'up' || text === 'down') {
        timer_count = text;
      } if (timer_count === 'up') {
        document.getElementById("count_up_button").style.setProperty("--count_up_color", "#FFDC87");
        document.getElementById("count_up_button").style.setProperty("--count_up_border_color", "#C5A574");
        document.getElementById("count_up_button").style.setProperty("--count_up_hover_color", "#F5CB69");
        document.getElementById("count_down_button").style.setProperty("--count_down_color", "#91DCFF");
        document.getElementById("count_down_button").style.setProperty("--count_down_border_color", "#60AADE");
        document.getElementById("count_down_button").style.borderLeft = "none";
        document.getElementById("count_down_button").style.setProperty("--count_down_hover_color", "#7AC8FF");
      } else {
        document.getElementById("count_up_button").style.setProperty("--count_up_color", "#91DCFF");
        document.getElementById("count_up_button").style.setProperty("--count_up_border_color", "#60AADE");
        document.getElementById("count_up_button").style.setProperty("--count_up_hover_color", "#7AC8FF");
        document.getElementById("count_up_button").style.borderRight = "none";
        document.getElementById("count_down_button").style.setProperty("--count_down_color", "#FFDC87");
        document.getElementById("count_down_button").style.setProperty("--count_down_border_color", "#C5A574");
        document.getElementById("count_down_button").style.setProperty("--count_down_hover_color", "#F5CB69");
      }
    }

    // 画面の入力欄（Input）の数値を最新の変数と同期する関数
    function update_settings_display(total) {
      document.getElementById("minute").value = minute;
      document.getElementById("second").value = second;
      now_seconds = minute * 60 + second;
      if (total === "total") {
        total_seconds = minute * 60 + second;
      }
    }

    function update_timer_display() {
      document.getElementById("timer_screen_text").textContent = minute.toString().padStart(2, '0') + ":" + second.toString().padStart(2, '0');
      document.querySelector(".progress_bar").style.width = (now_seconds / total_seconds) * 100 + "%";
      document.querySelector("#timer_circle_progress").style.strokeDashoffset = offset;
    }

    // 入力欄から現在の数値を読み込む関数
    function load_settings_inputs(total) {
      minute = parseInt(document.getElementById("minute").value) || 0;
      second = parseInt(document.getElementById("second").value) || 0;
      now_seconds = minute * 60 + second;
      if (total === "total") {
        total_seconds = now_seconds;
      }
    }

    function a_up_timer(up_time) {
      load_settings_inputs("total"); // 現在の入力を取得
      switch (up_time) {
        case 'minute': minute++; break;
        case 'second': second++; break;
      }
      update_settings_display("total"); // 画面を更新
    }

    function a_down_timer(down_time) {
      load_settings_inputs("total"); // 現在の入力を取得
      switch (down_time) {
        case 'minute': if (minute > 0) minute--; break;
        case 'second': if (second > 0) second--; break;
      }
      update_settings_display("total"); // 画面を更新
    }

    const getLength = radius => (radius * 2) * 3.14;//関数 "円の周の長さを計算する"
    const getStep = (length, time) => length / time;//関数 "1秒あたりの移動距離を計算する"

    let offset = 0;

    function timer() {
      if (timer_count === "down") {
        // ダウンカウント処理
        if (minute === 0 && second === 0) {
          clearInterval(timer_interval);
          timer_interval = null;
          document.querySelector("#timer_screen_text").style.color = "red";
          audio = new Audio('alarm.mp3');
          audio.play();
          return;
        }

        if (second > 0) {
          second--;
          offset = offset + getStep(getLength(50), total_seconds);
        } else {
          second = 59;
          offset = offset + getStep(getLength(50), total_seconds);
          if (minute > 0) {
            minute--;
          }
        }
        now_seconds = minute * 60 + second;
      } else {
        // アップカウント処理
        second++;
        offset = offset - getStep(getLength(50), total_seconds);
        if (second >= 60) {
          second = 0;
          minute++;
        }

        now_seconds = minute * 60 + second;
        if (now_seconds > total_seconds) {
          clearInterval(timer_interval);
          timer_interval = null;
          document.querySelector("#timer_screen_text").style.color = "red";
          audio = new Audio('alarm.mp3');
          audio.play();
          return;
        }
      }
      update_timer_display();
    }

    // タイマー開始
    function timer_start() {
      if (timer_interval !== null || total_seconds == 0) return; // 既に動いていたら二重起動防止
      document.querySelector("#settings_screen").classList.replace("enable", "disable");
      document.querySelector("#timer_screen").classList.replace("disable", "enable"); // 画面切り替え
      if (timer_count === "up") {
        offset = getLength(50);
      } else {
        offset = 0;
      }

      load_settings_inputs("total");
      up_count_reset = "true"; // アップカウントのリセットフラグを立てる
      document.querySelector("#timer_screen_text").style.color = "white"; // テキストを白色にする

      //アップカウントのときのラグ対策
      if (timer_count === "up" && now_seconds > 0) {
        second = 0;
        minute = 0;
        up_count_reset = "false";
        update_timer_display();
        document.querySelector(".progress_bar").style.width = "0%";
        document.querySelector("#timer_circle_progress").style.strokeDashoffset = getLength(50);
      }
      timer_interval = setInterval(timer, 1000);
    }

    // リセット
    function reset() {
      minute = 0;
      second = 0;
      update_settings_display();
    }

    function stop() {
      document.querySelector("#settings_screen").classList.replace("disable", "enable");
      document.querySelector("#timer_screen").classList.replace("enable", "disable");
      clearInterval(timer_interval);
      timer_interval = null;
    }

    function pause() {
      if (pause_state === "running") {
        pause_state = "paused";
        pause_to = "pause";
        clearInterval(timer_interval);
        timer_interval = null;
      } else {
        pause_state = "running";
        pause_to = "running";
        timer_interval = setInterval(timer, 1000);
      }
      document.querySelector('.progress_bar').style.animationPlayState = pause_state;
      document.getElementById('timer_circle_progress').style.animationPlayState = pause_state;
    }

    document.querySelector('.timer_control').addEventListener('wheel', (event) => {
      if (event.deltaY > 0) {
        a_down_timer(second);
      } else {
        a_up_timer(second);
      }
    }, { passive: true });
  </script>
</body>

</html>
